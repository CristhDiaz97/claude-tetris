<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Menú de pausa">
      <div class="overlay-box pause-box">
        <div id="pause-main" class="pause-view">
          <p class="pause-title">PAUSA</p>
          <button id="pause-resume" class="menu-btn primary">Reanudar</button>
          <button id="pause-restart" class="menu-btn">Reiniciar</button>
          <button id="pause-controls" class="menu-btn">Ver controles</button>
          <label class="menu-row" for="start-level-select">
            <span>Nivel inicial<br><small>(al reiniciar)</small></span>
            <select id="start-level-select"></select>
          </label>
        </div>
        <div id="pause-help" class="pause-view hidden">
          <p class="pause-title">CONTROLES</p>
          <ul class="help-list">
            <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
            <li><span><kbd>↑</kbd> <kbd>X</kbd></span> rotar</li>
            <li><span><kbd>↓</kbd></span> bajar</li>
            <li><span><kbd>Space</kbd></span> caída instantánea</li>
            <li><span><kbd>P</kbd> <kbd>Esc</kbd></span> pausa / reanudar</li>
          </ul>
          <button id="pause-back" class="menu-btn">Volver</button>
        </div>
      </div>
    </div>
  </div>

  <script src="pause.js"></script>
  <script src="game.js"></script>
</body>
</html>
